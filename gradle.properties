# Gradle
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
org.gradle.parallel = true
org.gradle.caching = true

# Mod metadata
mod_id = engineered_combustion
mod_name = Create: Engineered Combustion
mod_version = 0.1.0
mod_group_id = dev.engineeredcombustion
mod_authors = Create: Engineered Combustion contributors
mod_description = Modular, player-constructible internal combustion engines for Create.

# Minecraft / NeoForge
# https://neoforged.net/
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1,1.22)
neo_version = 21.1.219
neo_version_range = [21.1.0,)
loader_version_range = [4,)

# Mappings
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version = 1.21.1
parchment_version = 2024.11.17

# Create
# https://maven.createmod.net/com/simibubi/create/create-1.21.1/
#
# IMPORTANT: the Maven version is NOT just the release version. Create's
# build.gradle appends its Jenkins build number:
#     version = mod_version + (dev && buildNumber != null ? "-${buildNumber}" : "")
# so release 6.0.10 is published as the artifact 6.0.10-280. Asking for plain
# "6.0.10" fails with "Could not find com.simibubi.create:create-1.21.1:6.0.10".
# To find the number for another release, list the versions at the URL above.
create_version = 6.0.10-280

# The *mod* version Create reports to the mod loader is plain 6.0.10 (its
# neoforge.mods.toml template uses mod_version, without the build number), so
# this range deliberately has no build number in it.
create_version_range = [6.0.10,)

# Create's own required libraries. Versions are taken verbatim from the
# gradle.properties of the Create mc1.21.1-6.0.10 tag so that the development
# environment matches what Create 6.0.10 actually ships with.
# Catnip is *not* a separate artifact in this version - it is contained in the
# Ponder jar, so declaring Ponder is what puts net.createmod.catnip on the
# classpath.
registrate_version = MC1.21-1.3.0+67
ponder_version = 1.0.82
flywheel_version = 1.0.6
flywheel_version_range = [1.0.0,2.0)
