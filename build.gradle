plugins {
    id("java-library")
    id("idea")
    id("eclipse")
    id("maven-publish")
    // https://projects.neoforged.net/neoforged/ModDevGradle
    // Same ModDevGradle version Create 6.0.10 builds with.
    id("net.neoforged.moddev") version "2.0.107"
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
    group = mod_group_id
    version = mod_version
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        configureEach {
            systemProperty("forge.logging.markers", "REGISTRIES")
            jvmArgument("-XX:+IgnoreUnrecognizedVMOptions")
            jvmArgument("-XX:+AllowEnhancedClassRedefinition")
        }

        client {
            client()
        }

        server {
            server()
            gameDirectory = project.file("run/server")
            programArgument("--nogui")
        }

        data {
            data()
            programArguments.addAll(
                "--mod", mod_id as String,
                "--all",
                "--output", file("src/generated/resources/").getAbsolutePath(),
                "--existing", file("src/main/resources/").getAbsolutePath()
            )
        }
    }
}

// ---------------------------------------------------------------------------
// Pure simulation tests
// ---------------------------------------------------------------------------
//
// The engine simulation is deliberately free of Minecraft, NeoForge and Create
// types, and this source set is the payoff for that discipline: it compiles the
// simulation and its tests with an EMPTY compile classpath, so the whole of the
// engine's behaviour can be exercised without downloading Minecraft, without
// decompiling it, and without launching a game.
//
// That empty classpath is load-bearing rather than an optimisation. It is what
// mechanically enforces the rule the simulation is built on: if anyone ever
// imports a Minecraft type into EngineState, EngineTuning, EngineLayout or their
// neighbours, THIS COMPILE FAILS. The two classes in the package that do touch
// Minecraft - EngineComponents, which resolves block entities out of a level, and
// CombustionAudio, which plays sounds into one - are excluded by name below, and
// that exclusion list is the exhaustive statement of where the boundary is.
//
// The tests are plain classes with a main method rather than JUnit, on purpose:
// adding a test framework would mean a dependency to resolve, and the one thing
// this source set is for is being runnable with nothing but a JDK.
//
// src/prototype/java is the Milestone 15A four-stroke prototype, and it is added
// HERE AND NOWHERE ELSE. sourceSets.main never sees that directory, so the
// mod jar cannot contain the prototype and no production class can compile
// against it - the isolation the milestone requires is enforced by the build
// rather than by a promise in a comment.
sourceSets {
    simulationTest {
        java {
            srcDir "src/main/java"
            srcDir "src/simulationTest/java"
            srcDir "src/prototype/java"
            include "dev/engineeredcombustion/content/engine/*.java"
            exclude "dev/engineeredcombustion/content/engine/EngineComponents.java"
            exclude "dev/engineeredcombustion/content/engine/CombustionAudio.java"
            include "dev/engineeredcombustion/prototype/**/*.java"
            include "*.java"
        }
        compileClasspath = files()
        runtimeClasspath = output
    }
}

/**
 * Every pure simulation suite, each a class with a main method that prints its
 * checks and exits non-zero on failure.
 */
var simulationTestClasses = [
    "EngineStabilityTests",
    "EngineReloadTests",
    "MultiCylinderTests",
    "SparkPlugTests",
    "EngineLayoutTests",
    "EngineCapacityTests",
    "LastPowerStrokeTests",
    "EngineCoastDownTests",
    "EngineWearTests",
    "EngineEventTests",
    // Milestone 15A/15A.1 prototype. Drives src/prototype/java, which nothing in
    // the mod depends on.
    "FourStrokeCycleTests",
    "FourStrokeFiringOrderTests",
    "FourStrokeStateTests",
    "FourStrokeBalanceTests",
    // Milestone 15A.2 valvetrain prototype.
    "ValvetrainTests",
    // Milestone 15A.3 legacy save migration prototype.
    "EngineMigrationTests",
    // Engine-wide installed-component ownership and conservation.
    "InstalledComponentConservationTests",
]

var simulationTestTasks = simulationTestClasses.collect { className ->
    tasks.register("simulationTest${className}", JavaExec) {
        group = "verification"
        description = "Runs the ${className} pure simulation suite."
        classpath = sourceSets.simulationTest.runtimeClasspath
        mainClass = className
        javaLauncher = javaToolchains.launcherFor(java.toolchain)
    }
}

var simulationTest = tasks.register("simulationTest") {
    group = "verification"
    description = "Runs every pure engine simulation test. Needs no Minecraft."
    dependsOn simulationTestTasks
}

// ---------------------------------------------------------------------------
// Generated asset validation
// ---------------------------------------------------------------------------

var checkModels = tasks.register("checkModels", Exec) {
    group = "verification"
    description = "Validates the generated block models with tools/check_models.py."
    // Explicit and cross-platform: `python` is Python 2 on some distributions and
    // absent on others, so the interpreter is chosen rather than assumed.
    var python = System.getProperty("os.name").toLowerCase().contains("windows") ? "python" : "python3"
    commandLine python, "tools/check_models.py"
    workingDir = project.projectDir
    // Without this, a missing interpreter surfaces as an opaque Gradle exec
    // failure. The model checker itself already exits non-zero on any problem,
    // which is what fails the build.
    doFirst {
        try {
            var probe = new ProcessBuilder(python, "--version").redirectErrorStream(true).start()
            if (!probe.waitFor(30, java.util.concurrent.TimeUnit.SECONDS) || probe.exitValue() != 0)
                throw new GradleException(missingPythonMessage(python))
        } catch (IOException e) {
            throw new GradleException(missingPythonMessage(python), e)
        }
    }
}

/**
 * The player-visible surface: advancement ids and parents, Ponder scene keys,
 * structure files, and both language files agreeing with each other.
 *
 * <p>None of it is code, so none of it is caught by compiling or by the
 * simulation suites - a mistyped advancement parent makes a branch silently
 * vanish, and a missing translation key renders as the key itself on screen.
 */
var validateUx = tasks.register("validateUx", Exec) {
    group = "verification"
    description = "Validates advancements, Ponder scenes, structures and translations."
    var python = System.getProperty("os.name").toLowerCase().contains("windows") ? "python" : "python3"
    commandLine python, "tools/validate_ux.py"
    workingDir = project.projectDir
    doFirst {
        try {
            var probe = new ProcessBuilder(python, "--version").redirectErrorStream(true).start()
            if (!probe.waitFor(30, java.util.concurrent.TimeUnit.SECONDS) || probe.exitValue() != 0)
                throw new GradleException(missingPythonMessage(python))
        } catch (IOException e) {
            throw new GradleException(missingPythonMessage(python), e)
        }
    }
}

static String missingPythonMessage(String python) {
    return "checkModels needs ${python} on PATH to run tools/check_models.py, and could not start it.\n" +
        "Install Python 3, or run the model check yourself with:  python3 tools/check_models.py"
}

// ---------------------------------------------------------------------------

tasks.named("check") {
    dependsOn simulationTest, checkModels, validateUx
}

repositories {
    mavenLocal()
    // Create, Ponder (contains Catnip) and Flywheel
    maven { url = "https://maven.createmod.net" }
    // Registrate - Create bundles it via jarJar, but the `slim` Create artifact
    // used below does not, so the dev runtime needs it explicitly.
    maven { url = "https://maven.ithundxr.dev/snapshots" }
}

dependencies {
    // The `slim` classifier is Create without its jarJar'd libraries. Transitive
    // resolution is disabled on purpose: Create's published POM also lists all of
    // its optional compat mods (JEI, FTB, JourneyMap, ...), which an addon does
    // not want to drag in. Everything Create genuinely needs is declared below.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }

    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")

    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        minecraft_version_range: minecraft_version_range,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        create_version_range   : create_version_range,
    ]
    inputs.properties(replaceProperties)
    expand(replaceProperties)
    from("src/main/templates")
    into("build/generated/sources/modMetadata")
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}
